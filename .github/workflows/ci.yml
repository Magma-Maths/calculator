name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs queue instead of cancelling: a cancelled run leaves its commit with no image.
  # queue: max holds every pending run; the default, single, keeps only the newest pending
  # one. It may not be combined with cancel-in-progress: true and is not documented to take
  # an expression, so PR-branch runs queue as well rather than superseding each other.
  queue: max
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/magma-maths/calculator

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # Pull requests build the image but publish nothing, so a broken Dockerfile
      # fails before the merge rather than on main.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'Magma-Maths' }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the short commit tag
        id: tag
        # promote.yml looks up sha-<first 7 hex chars>; the length must match here.
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: CALCULATOR_VERSION=${{ github.sha }}
          load: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.tag.outputs.short }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          # mode=max also caches the builder stage, which the final image does not contain.
          # Only main writes the cache: a fork pull request has no permission to.
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max' || '' }}

      - name: Smoke test the image
        run: docker run --rm ${{ env.IMAGE }}:sha-${{ steps.tag.outputs.short }} python -c "import app.main"

      - name: Push
        if: env.PUBLISH == 'true'
        run: |
          docker push ${{ env.IMAGE }}:sha-${{ steps.tag.outputs.short }}
          docker push ${{ env.IMAGE }}:main
