name: "magma-sandbox"
description: "Sandbox for Magma calculator execution"

mode: ONCE
time_limit: 0
rlimit_as_type: SOFT
rlimit_cpu_type: SOFT

uidmap {
    inside_id: "calculator"
    outside_id: "calculator"
}
gidmap {
    inside_id: "calculator"
    outside_id: "calculator"
}

clone_newnet: true
clone_newpid: true
clone_newns: true
clone_newuts: true

# Nothing in the jail may be setuid or a device node. Only /tmp is writable,
# and Magma's -w is not the boundary, so nothing written there may run either.
# The read-only trees stay executable: magma.exe and the shared libraries.
mount {
    src: "/opt/magma"
    dst: "/opt/magma"
    is_bind: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
    nosuid: true
    nodev: true
    noexec: true
    options: "size=67108864"
}
mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
    nosuid: true
    nodev: true
    mandatory: false
}
mount {
    src: "/etc/ld.so.cache"
    dst: "/etc/ld.so.cache"
    is_bind: true
    rw: false
    nosuid: true
    nodev: true
    mandatory: false
}

envar: "PATH=/usr/bin:/bin"
envar: "HOME=/tmp"

# Constant exports of the magma launcher script, which cannot run in here
# (no shell). The root-dependent ones are passed by the executor via --env.
envar: "MAGMA_LIBRARIES=c9lattices:examples:galpols:intro:isolgps:matgps:pergps:simgps:solgps"
envar: "MKL_SERIAL=YES"
envar: "OMP_NUM_THREADS=1"
envar: "OPENBLAS_NUM_THREADS=1"

keep_env: false
